[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guidekit"
version = "0.1.0"
description = "Static guide generator for Markdown and YAML content."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rares Suciu" }]
dependencies = ["typer>=0.12", "rich>=13.7", "pydantic>=2.8", "PyYAML>=6.0", "Jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
guidekit = "guidekit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["guidekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
